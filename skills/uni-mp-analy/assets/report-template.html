<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微信小程序体积分析报告</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fa;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #dfe5ee;
      --primary: #1769e0;
      --primary-soft: #eaf2ff;
      --success: #18864b;
      --warning: #a65d00;
      --error: #c73434;
      --shadow: 0 12px 32px rgba(25, 42, 70, 0.07);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1440px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0 56px; }
    .hero { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 8px; color: var(--primary); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(27px, 4vw, 40px); letter-spacing: -.03em; }
    .hero-meta { margin: 12px 0 0; color: var(--muted); line-height: 1.7; }
    .stage-list { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 520px; }
    .stage, .badge { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 7px 11px; font-size: 12px; }
    .stage::before, .badge::before { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); content: ""; }
    .status-ok::before, .severity-info::before { background: var(--success); }
    .status-error::before, .severity-error::before { background: var(--error); }
    .status-skipped::before, .severity-warning::before { background: var(--warning); }
    .grid { display: grid; gap: 18px; }
    .overview { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .card, .section { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .card { min-height: 132px; padding: 20px; }
    .card-label { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .card-value { margin: 0; font-size: 27px; font-weight: 750; letter-spacing: -.02em; }
    .card-detail { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .section { margin-top: 18px; padding: 22px; }
    .section-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; margin-bottom: 18px; }
    .section-head.single { display: block; }
    h2 { margin: 0; font-size: 19px; }
    h3 { margin: 0; font-size: 15px; }
    .section-note, .empty, .list-summary { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .section-note { margin: 6px 0 0; }
    .empty { margin: 0; padding: 22px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }
    .source-panel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
    .source-item { border-radius: 12px; background: var(--surface-subtle); padding: 14px; }
    .source-item strong { display: block; margin-bottom: 5px; font-size: 13px; }
    .source-item span { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .notes { margin: 14px 0 0; padding-left: 20px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 8px 12px; font-weight: 400; cursor: pointer; }
    .filter:hover, .filter:focus-visible { border-color: var(--primary); }
    .filter.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .package-table, .comparison-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { color: var(--muted); font-weight: 600; text-align: left; }
    th, td { border-bottom: 1px solid var(--line); padding: 11px 10px; }
    th:last-child, td:last-child { text-align: right; }
    .viewer-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 760px; border-radius: 8px; overflow: hidden; background: #2e2e2e; }
    .viewer-layout iframe { width: 100%; height: 100%; border: 0; min-width: 0; }
    #viewer-navigator { border-right: 1px solid #555; }
    .issue-list, .duplicate-list { margin: 0; padding: 0; list-style: none; }
    .two-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .issue, .duplicate { border: 1px solid var(--line); border-radius: 12px; padding: 15px; }
    .issue + .issue, .duplicate + .duplicate { margin-top: 10px; }
    .issue-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .issue p, .duplicate p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .severity { border-radius: 999px; padding: 4px 8px; font-size: 11px; font-weight: 700; }
    .severity-info { background: #eaf7f0; color: var(--success); }
    .severity-warning { background: #fff3dc; color: var(--warning); }
    .severity-error { background: #ffeded; color: var(--error); }
    .quality-detail { margin: 10px 0 0; max-height: 180px; overflow: auto; border-radius: 8px; background: #111827; color: #dce5f5; padding: 10px; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .quality-original { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .quality-original summary { cursor: pointer; }
    .doc-link { color: var(--primary); font-size: 12px; }
    .file-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .file-tag { border: 0; border-radius: 6px; background: var(--primary-soft); color: var(--primary); padding: 5px 7px; font-size: 11px; cursor: pointer; }
    .delta-positive { color: var(--error); }
    .delta-negative { color: var(--success); }
    .delta-zero { color: var(--muted); }
    .comparison-warning { border-left: 3px solid var(--warning); background: #fff9ed; padding: 10px 12px; color: #704300; font-size: 13px; }
    .comparison-warning + .comparison-warning { margin-top: 7px; }
    .footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
    .hidden { display: none !important; }

    @media (max-width: 980px) {
      .overview, .source-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two-columns { grid-template-columns: 1fr; }
      .viewer-layout { grid-template-columns: 220px minmax(0, 1fr); }
    }

    @media (max-width: 640px) {
      .shell { width: min(100% - 24px, 1440px); padding-top: 20px; }
      .hero { display: block; }
      .stage-list { justify-content: flex-start; margin-top: 16px; }
      .overview, .source-panel { grid-template-columns: 1fr; }
      .section { padding: 16px; }
      .section-head { display: block; }
      .section-head .filter-bar { margin-top: 12px; }
      .viewer-layout { grid-template-columns: 180px minmax(0, 1fr); height: 680px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <section aria-labelledby="report-title">
        <p class="eyebrow">uni-app · 微信小程序</p>
        <h1 id="report-title">体积分析报告</h1>
        <p class="hero-meta" id="hero-meta"></p>
      </section>
      <div class="stage-list" id="stage-list" aria-label="分析阶段状态"></div>
    </header>

    <section class="grid overview" id="overview" aria-label="包概览"></section>

    <section class="section" aria-labelledby="source-title">
      <header class="section-head single">
        <h2 id="source-title">数据口径</h2>
        <p class="section-note">文件体积与上传预览包体积属于不同口径，不应直接互相替代。</p>
      </header>
      <div class="source-panel" id="source-panel"></div>
      <ul class="notes" id="measurement-notes"></ul>
    </section>

    <section class="section" aria-labelledby="package-title">
      <div class="section-head">
        <div>
          <h2 id="package-title">包分布</h2>
          <p class="section-note">选择包后定位到代码包分析视图。</p>
        </div>
        <div class="filter-bar" id="package-filter" aria-label="包筛选"></div>
      </div>
      <div id="package-table"></div>
    </section>

    <section class="section" id="viewer-section" aria-labelledby="viewer-title">
      <header class="section-head">
        <div>
          <h2 id="viewer-title">代码包分析</h2>
          <p class="section-note">沿用开发者工具原版树图、筛选和依赖导航。小节点隐藏后参与原版大小分摊；JSON 保留原始测量值。图内单位按 1024 换算。</p>
        </div>
        <button class="filter" id="download-analysis" type="button">导出 analysis.json</button>
      </header>
      <div class="viewer-layout">
        <iframe id="viewer-navigator" title="文件导航与筛选"></iframe>
        <iframe id="viewer-dashboard" title="代码包树图与模块依赖图"></iframe>
      </div>
      <p class="section-note" id="viewer-status" role="status"></p>
      <p class="section-note" id="viewer-file" hidden></p>
    </section>

    <div class="grid two-columns">
      <section class="section" aria-labelledby="finding-title">
        <header class="section-head single">
          <h2 id="finding-title">质量检查</h2>
          <p class="section-note">包含分析提示与官方检查结果。未通过项需结合配置和实际引用核实，不等同于发布阻断或可直接删除的结论。</p>
        </header>
        <div id="quality-content"></div>
      </section>

      <section class="section" aria-labelledby="duplicate-title">
        <header class="section-head single">
          <h2 id="duplicate-title">重复资源</h2>
          <p class="section-note">potentialBytes 为理论可减少体积，实际效果取决于引用与构建方式。</p>
        </header>
        <div id="duplicate-content"></div>
      </section>
    </div>

    <section class="section hidden" id="comparison-section" aria-labelledby="comparison-title">
      <header class="section-head single">
        <h2 id="comparison-title">基准对比</h2>
        <p class="section-note" id="comparison-note"></p>
      </header>
      <div id="comparison-content"></div>
    </section>

    <footer class="footer" id="footer"></footer>
  </main>

  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script id="viewer-resources" type="application/json">__VIEWER_RESOURCES__</script>
  <script>__VIEWER_HOST__</script>
  <script>
    // Generated by Skill uni-mp-analy 2.1.0.
    (function () {
      "use strict";

      var MAX_FILE_ROWS = 200;
      var selectedPackage = "*";
      var report = parseReport();
      var files = arrayValue(report.files);
      var packages = arrayValue(report.packages);
      renderHeader();
      renderOverview();
      renderSources();
      renderPackageFilter();
      renderPackageTable();
      renderQuality();
      renderDuplicates();
      renderComparison();
      renderFooter();

      function parseReport() {
        var node = document.getElementById("report-data");
        try {
          var parsed = JSON.parse(node.textContent || "{}");
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (error) {
          return { stages: { analysis: { status: "error", message: "报告数据无法解析" } } };
        }
      }

      function arrayValue(value) {
        return Array.isArray(value) ? value : [];
      }

      function objectValue(value) {
        return value && typeof value === "object" && !Array.isArray(value) ? value : {};
      }

      function stringValue(value, fallback) {
        return typeof value === "string" && value ? value : fallback;
      }

      function finiteNumber(value, fallback) {
        return typeof value === "number" && Number.isFinite(value) ? value : fallback;
      }

      function byteText(value) {
        if (typeof value !== "number" || !Number.isFinite(value)) return "未验证";
        var absolute = Math.abs(value);
        // uni-mp-analy 2.0.0: report display uses decimal byte units, matching KB/MB/GB labels.
        if (absolute < 1000) return formatNumber(value) + " B";
        if (absolute < 1000 * 1000) return formatDecimal(value / 1000) + " KB";
        if (absolute < 1000 * 1000 * 1000) return formatDecimal(value / 1000 / 1000) + " MB";
        return formatDecimal(value / 1000 / 1000 / 1000) + " GB";
      }

      function formatNumber(value) {
        return new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 0 }).format(value);
      }

      function formatDecimal(value) {
        return new Intl.NumberFormat("zh-CN", { minimumFractionDigits: 1, maximumFractionDigits: 2 }).format(value);
      }

      function dateText(value) {
        if (typeof value !== "string" || !value) return "生成时间未知";
        var timestamp = Date.parse(value);
        if (!Number.isFinite(timestamp)) return value;
        return new Intl.DateTimeFormat("zh-CN", { dateStyle: "medium", timeStyle: "medium" }).format(new Date(timestamp));
      }

      function setText(node, value) {
        node.textContent = value;
        return node;
      }

      function element(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (typeof text === "string") node.textContent = text;
        return node;
      }

      function renderHeader() {
        var project = objectValue(report.project);
        var tool = objectValue(report.tool);
        var parts = [
          stringValue(project.name, "未命名项目"),
          frameworkText(project.framework),
          buildModeText(project.buildMode),
          dateText(report.generatedAt)
        ];
        if (stringValue(project.label, "")) parts.splice(1, 0, project.label);
        setText(document.getElementById("hero-meta"), parts.join(" · "));
        setText(document.getElementById("report-title"), stringValue(project.name, "微信小程序") + " · 体积分析报告");
        document.title = stringValue(project.name, "微信小程序") + " · 体积分析报告";

        var stages = objectValue(report.stages);
        var definitions = [
          ["分析", objectValue(stages.analysis)],
          ["质量", objectValue(stages.quality)],
          ["预览", objectValue(stages.preview)]
        ];
        var stageList = document.getElementById("stage-list");
        definitions.forEach(function (definition) {
          var status = stringValue(definition[1].status, "unknown");
          var node = element("span", "stage status-" + safeStatus(status));
          node.textContent = definition[0] + " · " + statusText(status);
          var message = stringValue(definition[1].message, "");
          if (message) node.title = message;
          stageList.appendChild(node);
        });
        var toolText = [stringValue(tool.name, "工具未知"), stringValue(tool.version, "版本未知"), stringValue(tool.nodeVersion, "Node 未知")].join(" · ");
        stageList.appendChild(element("span", "stage", toolText));
      }

      function frameworkText(value) {
        if (value === "vue2-webpack") return "Vue 2 / webpack";
        if (value === "vue3-vite") return "Vue 3 / Vite";
        return "框架未知";
      }

      function buildModeText(value) {
        if (value === "production") return "生产构建";
        if (value === "existing") return "现有产物";
        return "构建模式未知";
      }

      function safeStatus(value) {
        return value === "ok" || value === "error" || value === "skipped" ? value : "unknown";
      }

      function statusText(value) {
        if (value === "ok") return "完成";
        if (value === "error") return "失败";
        if (value === "skipped") return "跳过";
        return "未知";
      }

      function renderOverview() {
        var totals = objectValue(report.totals);
        var definitions = [
          ["文件体积合计", byteText(finiteNumber(totals.fileBytes, 0)), "来源：miniprogram-ci.analyseCode"],
          ["文件数量", formatNumber(finiteNumber(totals.fileCount, files.length)), "analyseCode 返回的文件总数"],
          ["上传预览包体积", byteText(totals.packedBytes), totals.packedBytes === null || typeof totals.packedBytes !== "number" ? "未取得官方 preview 结果" : "来源：miniprogram-ci.preview"],
          ["未关联文件", byteText(finiteNumber(totals.unlinkedBytes, 0)), formatNumber(finiteNumber(totals.unlinkedCount, 0)) + " 个文件未关联到模块"]
        ];
        var container = document.getElementById("overview");
        definitions.forEach(function (definition) {
          var card = element("article", "card");
          card.appendChild(element("p", "card-label", definition[0]));
          card.appendChild(element("p", "card-value", definition[1]));
          card.appendChild(element("p", "card-detail", definition[2]));
          container.appendChild(card);
        });
      }

      function renderSources() {
        var measurement = objectValue(report.measurement);
        var totals = objectValue(report.totals);
        var definitions = [
          ["文件体积来源", stringValue(measurement.fileSizeSource, "未提供")],
          ["包体积来源", typeof totals.packedBytes === "number" ? stringValue(measurement.packageSizeSource, "来源未提供") : "未验证"],
          ["树图口径", "基于 analyseCode；图内沿用原版小节点分摊"]
        ];
        var panel = document.getElementById("source-panel");
        definitions.forEach(function (definition) {
          var item = element("div", "source-item");
          item.appendChild(element("strong", "", definition[0]));
          item.appendChild(element("span", "", definition[1]));
          panel.appendChild(item);
        });
        var notes = arrayValue(measurement.notes);
        var notesNode = document.getElementById("measurement-notes");
        notes.forEach(function (note) {
          notesNode.appendChild(element("li", "", String(note)));
        });
        if (!notes.length) notesNode.classList.add("hidden");
      }

      function renderPackageFilter() {
        var container = document.getElementById("package-filter");
        appendPackageButton(container, "*", "全部包");
        var seen = new Set();
        packages.forEach(function (packageItem) {
          var name = stringValue(packageItem && packageItem.name, "");
          if (!name || seen.has(name)) return;
          seen.add(name);
          appendPackageButton(container, name, packageLabel(packageItem));
        });
        files.forEach(function (file) {
          var name = stringValue(file && file.package, "__APP__");
          if (seen.has(name)) return;
          seen.add(name);
          appendPackageButton(container, name, name === "__APP__" ? "主包" : name);
        });
      }

      function appendPackageButton(container, value, label) {
        var button = element("button", "filter" + (value === selectedPackage ? " active" : ""), label);
        button.type = "button";
        button.dataset.package = value;
        button.addEventListener("click", function () {
          selectedPackage = value;
          Array.prototype.forEach.call(container.querySelectorAll("button"), function (item) {
            item.classList.toggle("active", item.dataset.package === value);
          });
          window.offlineViewer.selectPackage(value);
        });
        container.appendChild(button);
      }

      function packageLabel(packageItem) {
        var name = stringValue(packageItem && packageItem.name, "");
        return stringValue(packageItem && packageItem.label, name === "__APP__" ? "主包" : name || "未命名包");
      }

      function renderPackageTable() {
        var host = document.getElementById("package-table");
        if (!packages.length) {
          host.appendChild(element("p", "empty", "没有包级统计数据。"));
          return;
        }
        var table = element("table", "package-table");
        var head = element("thead", "");
        var headRow = element("tr", "");
        ["包", "文件数", "analyseCode 文件体积", "preview 包体积"].forEach(function (label) {
          headRow.appendChild(element("th", "", label));
        });
        head.appendChild(headRow);
        table.appendChild(head);
        var body = element("tbody", "");
        packages.forEach(function (packageItem) {
          var row = element("tr", "");
          row.appendChild(element("td", "", packageLabel(packageItem)));
          row.appendChild(element("td", "", formatNumber(finiteNumber(packageItem && packageItem.fileCount, 0))));
          row.appendChild(element("td", "", byteText(finiteNumber(packageItem && packageItem.fileBytes, 0))));
          row.appendChild(element("td", "", byteText(packageItem && packageItem.packedBytes)));
          body.appendChild(row);
        });
        table.appendChild(body);
        host.appendChild(table);
      }

      function selectFile(path) {
        window.offlineViewer.selectFile(path);
      }

      function renderQuality() {
        var host = document.getElementById("quality-content");
        var findings = arrayValue(report.findings);
        var quality = arrayValue(report.quality);
        if (!findings.length && !quality.length) {
          host.appendChild(element("p", "empty", "暂无质量检查结果，请结合分析阶段状态确认检查是否完成。"));
          return;
        }
        var list = element("ul", "issue-list");
        findings.forEach(function (finding) {
          var severity = safeSeverity(finding && finding.severity);
          var item = element("li", "issue");
          var head = element("div", "issue-head");
          head.appendChild(element("h3", "", stringValue(finding && finding.title, "未命名问题")));
          head.appendChild(element("span", "severity severity-" + severity, severityText(severity)));
          item.appendChild(head);
          item.appendChild(element("p", "", stringValue(finding && finding.description, "无说明")));
          var evidence = stringValue(finding && finding.evidence, "");
          if (evidence) item.appendChild(element("p", "", "证据：" + evidence));
          appendFileTags(item, arrayValue(finding && finding.files));
          list.appendChild(item);
        });
        quality.forEach(function (check) {
          var item = element("li", "issue");
          var head = element("div", "issue-head");
          var wording = qualityWording(check);
          head.appendChild(element("h3", "", wording.title));
          head.appendChild(element("span", "severity " + (wording.status === "通过" ? "severity-info" : "severity-warning"), wording.status));
          item.appendChild(head);
          item.appendChild(element("p", "quality-description", wording.description));
          var url = safeHttpUrl(check && check.docURL);
          if (url) {
            var link = element("a", "doc-link", "查看官方说明");
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            item.appendChild(link);
          }
          var original = element("details", "quality-original");
          original.appendChild(element("summary", "", "查看官方原始结果（含规则标识与英文说明）"));
          original.appendChild(element("pre", "quality-detail", stringifyDetail(check)));
          item.appendChild(original);
          list.appendChild(item);
        });
        host.appendChild(list);
      }

      // uni-mp-analy 2.0.0: localize the presentation only; success and raw evidence stay intact.
      // SDK text can describe a violation even for success=true; never infer status from that text.
      function qualityWording(check) {
        var definitions = new Map([
          ["PACKAGE_SIZE_LIMIT", ["包体积检查", "本次通过 SDK 的包体积检查；此结果不代表微信最终打包体积已验证。", "本次未通过 SDK 的包体积检查，请核对原始统计与包归属；最终包体积仍需预览结果确认。"]],
          ["JS_COMPRESS_OPEN", ["JavaScript 压缩配置", "SDK 配置检查显示已启用 JavaScript 压缩。", "SDK 配置检查未检测到启用 JavaScript 压缩。请结合构建配置和产物确认，不等同于产物一定未压缩。"]],
          ["WXML_COMPRESS_OPEN", ["WXML 压缩配置", "SDK 配置检查显示已启用 WXML 压缩。", "SDK 配置检查未检测到启用 WXML 压缩，请核对构建与微信编译配置。"]],
          ["WXSS_COMPRESS_OPEN", ["WXSS 压缩配置", "SDK 配置检查显示已启用 WXSS 压缩。", "SDK 配置检查未检测到启用 WXSS 压缩，请核对构建与微信编译配置。"]],
          ["LAZYCODE_LOADING_OPEN", ["代码按需注入配置", "SDK 检查显示已启用代码按需注入。", "SDK 未检测到启用代码按需注入。可评估配置 lazyCodeLoading，并验证页面和组件兼容性。"]],
          ["IMAGE_AND_AUDIO_LIMIT", ["图片与音频资源体积", "本次检查未发现超过该规则阈值的图片或音频资源。", "SDK 检测到超过该规则阈值的图片或音频资源，请核对文件明细并评估压缩或远程加载。"]],
          ["CONTAINS_OTHER_PKG_JS", ["分包专用脚本归属", "本次检查未发现仅由分包依赖、却留在主包的脚本。", "SDK 检测到仅由分包依赖、却留在主包的脚本，请核对引用关系后评估迁移。"]],
          ["CONTAINS_OTHER_PKG_COMPONENTS", ["分包专用组件归属", "本次检查未发现仅由分包依赖、却留在主包的组件。", "SDK 检测到仅由分包依赖、却留在主包的组件，请核对组件注册和引用后评估迁移。"]],
          ["CONTAINS_UNUSED_PLUGINS", ["未使用插件检查", "本次静态检查未发现未使用的插件。", "SDK 标记了可能未使用的插件，请核对实际使用情况，不要直接删除。"]],
          ["CONTAINS_UNUSED_COMPONENTS", ["未使用组件检查", "本次静态检查未发现未使用的组件。", "SDK 标记了可能未使用的组件，请核对动态引用与注册配置，不要直接删除。"]],
          ["CONTAINS_UNUSED_CODES", ["未关联依赖的文件", "本次官方检查未标记缺少依赖关联的文件，不代表所有运行时引用均已验证。", "SDK 标记了缺少依赖关联的文件。动态资源路径和平台约定可能未被静态分析覆盖，不能据此直接删除。"]]
        ]);
        var definition = definitions.get(check && check.name);
        var status = check && check.success === true ? "通过" : (check && check.success === false ? "未通过" : "未确认");
        var description = "此检查项尚无中文解释，请展开官方原始结果核对具体规则。";
        if (definition) description = status === "未确认" ? "SDK 未返回明确的通过状态，请展开官方原始结果核实。" : definition[status === "通过" ? 1 : 2];
        return { title: definition ? definition[0] : "其他官方检查", status: status, description: description };
      }

      function safeSeverity(value) {
        return value === "error" || value === "warning" || value === "info" ? value : "info";
      }

      function severityText(value) {
        if (value === "error") return "错误";
        if (value === "warning") return "警告";
        return "提示";
      }

      function safeHttpUrl(value) {
        if (typeof value !== "string") return "";
        try {
          var parsed = new URL(value);
          return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "";
        } catch (error) {
          return "";
        }
      }

      function stringifyDetail(value) {
        try {
          return typeof value === "string" ? value : JSON.stringify(value, null, 2);
        } catch (error) {
          return String(value);
        }
      }

      function appendFileTags(host, tagFiles) {
        if (!tagFiles.length) return;
        var tags = element("div", "file-tags");
        tagFiles.slice(0, 20).forEach(function (path) {
          var button = element("button", "file-tag", String(path));
          button.type = "button";
          button.addEventListener("click", function () { selectFile(String(path)); });
          tags.appendChild(button);
        });
        if (tagFiles.length > 20) tags.appendChild(element("span", "list-summary", "另有 " + formatNumber(tagFiles.length - 20) + " 个文件"));
        host.appendChild(tags);
      }

      function renderDuplicates() {
        var host = document.getElementById("duplicate-content");
        var duplicates = arrayValue(report.duplicates).slice().sort(function (left, right) {
          return finiteNumber(right && right.potentialBytes, 0) - finiteNumber(left && left.potentialBytes, 0);
        });
        if (!duplicates.length) {
          host.appendChild(element("p", "empty", "没有发现重复资源。"));
          return;
        }
        var list = element("ul", "duplicate-list");
        duplicates.forEach(function (duplicate) {
          var paths = arrayValue(duplicate && duplicate.paths);
          var item = element("li", "duplicate");
          item.appendChild(element("h3", "", byteText(duplicate && duplicate.size) + " × " + formatNumber(paths.length) + " 份"));
          item.appendChild(element("p", "", "理论可减少 " + byteText(duplicate && duplicate.potentialBytes) + " · SHA-256 " + stringValue(duplicate && duplicate.sha256, "未知")));
          appendFileTags(item, paths);
          list.appendChild(item);
        });
        host.appendChild(list);
      }

      function renderComparison() {
        var comparison = report.comparison;
        if (!comparison || typeof comparison !== "object") return;
        var section = document.getElementById("comparison-section");
        section.classList.remove("hidden");
        document.getElementById("comparison-note").textContent = "基准生成于 " + dateText(comparison.baselineGeneratedAt) + " · " + (comparison.comparable === true ? "可直接比较" : "口径可能不一致");
        var host = document.getElementById("comparison-content");
        arrayValue(comparison.warnings).forEach(function (warning) {
          host.appendChild(element("p", "comparison-warning", String(warning)));
        });
        var totals = objectValue(comparison.totals);
        var rows = [
          ["文件体积合计", objectValue(totals.fileBytes)],
          ["上传预览包体积", totals.packedBytes && typeof totals.packedBytes === "object" ? totals.packedBytes : null]
        ];
        var table = comparisonTable(["指标", "基准", "当前", "变化"], rows.map(function (row) {
          var metric = row[1];
          return [row[0], metric ? byteText(metric.before) : "未验证", metric ? byteText(metric.after) : "未验证", metric ? deltaNode(metric.delta) : element("span", "", "未验证")];
        }));
        host.appendChild(table);
        renderComparisonPackages(host, arrayValue(comparison.packages));
        renderComparisonFiles(host, arrayValue(comparison.files));
      }

      function comparisonTable(headers, rows) {
        var table = element("table", "comparison-table");
        var head = element("thead", "");
        var headRow = element("tr", "");
        headers.forEach(function (header) { headRow.appendChild(element("th", "", header)); });
        head.appendChild(headRow);
        table.appendChild(head);
        var body = element("tbody", "");
        rows.forEach(function (cells) {
          var row = element("tr", "");
          cells.forEach(function (cell) {
            var td = element("td", "");
            if (cell && typeof cell === "object" && cell.nodeType) td.appendChild(cell);
            else td.textContent = String(cell);
            row.appendChild(td);
          });
          body.appendChild(row);
        });
        table.appendChild(body);
        return table;
      }

      function deltaNode(value) {
        if (typeof value !== "number" || !Number.isFinite(value)) return element("span", "", "未验证");
        var className = value > 0 ? "delta-positive" : value < 0 ? "delta-negative" : "delta-zero";
        var prefix = value > 0 ? "+" : "";
        return element("span", className, prefix + byteText(value));
      }

      function renderComparisonPackages(host, comparisonPackages) {
        if (!comparisonPackages.length) return;
        host.appendChild(element("h3", "", "包体积变化"));
        var rows = [];
        comparisonPackages.forEach(function (packageItem) {
          var fileBytes = objectValue(packageItem && packageItem.fileBytes);
          var packedBytes = packageItem && packageItem.packedBytes && typeof packageItem.packedBytes === "object" ? packageItem.packedBytes : null;
          var name = stringValue(packageItem && packageItem.name, "未命名包");
          rows.push([
            name === "__APP__" ? "主包" : name,
            "analyseCode 文件体积",
            byteText(fileBytes.before),
            byteText(fileBytes.after),
            deltaNode(fileBytes.delta)
          ]);
          rows.push([
            name === "__APP__" ? "主包" : name,
            "preview 包体积",
            packedBytes ? byteText(packedBytes.before) : "未验证",
            packedBytes ? byteText(packedBytes.after) : "未验证",
            packedBytes ? deltaNode(packedBytes.delta) : element("span", "", "未验证")
          ]);
        });
        host.appendChild(comparisonTable(["包", "口径", "基准", "当前", "变化"], rows));
      }

      function renderComparisonFiles(host, comparisonFiles) {
        if (!comparisonFiles.length) return;
        var sorted = comparisonFiles.slice().sort(function (left, right) {
          return Math.abs(finiteNumber(right && right.delta, 0)) - Math.abs(finiteNumber(left && left.delta, 0));
        });
        host.appendChild(element("h3", "", "文件变化（按变化绝对值排序）"));
        var visible = sorted.slice(0, MAX_FILE_ROWS);
        var rows = visible.map(function (file) {
          return [
            stringValue(file && file.path, "未知文件"),
            comparisonStatusText(file && file.status),
            byteText(file && file.before),
            byteText(file && file.after),
            deltaNode(file && file.delta)
          ];
        });
        host.appendChild(comparisonTable(["文件", "状态", "基准", "当前", "变化"], rows));
        if (sorted.length > MAX_FILE_ROWS) host.appendChild(element("p", "list-summary", "仅显示 " + formatNumber(MAX_FILE_ROWS) + " / " + formatNumber(sorted.length) + " 个变化文件，完整总量为 " + formatNumber(sorted.length) + "。"));
      }

      function comparisonStatusText(value) {
        if (value === "added") return "新增";
        if (value === "removed") return "移除";
        if (value === "changed") return "变化";
        return "未知";
      }

      function renderFooter() {
        document.getElementById("footer").textContent = "Schema v" + String(finiteNumber(report.schemaVersion, 1)) + " · 单文件离线报告 · 未设置或推断任何微信包体积上限";
      }

    }());
  </script>
</body>
</html>
